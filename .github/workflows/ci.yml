name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    env:

      DATABASE_URL: "sqlserver://localhost:1433;database=master;user=sa;password=${{ secrets.DB_PASSWORD }};encrypt=true;trustServerCertificate=true"
      REDIS_URL: "redis://localhost:6379"

      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RBAC_APP_PASSWORD: ${{ secrets.RBAC_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Start infrastructure (Docker Compose)
        # Если ваш docker-compose.yml тоже требует пароль как переменную, раскомментируйте блок env ниже
        run: docker compose up -d
        # env:
        #   SA_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Install dependencies
        run: npm ci 

      - name: Wait for SQL Server to boot
        run: sleep 15

      - name: Push Prisma schema to test DB
        run: npx prisma db push

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Project
        run: npm run build